<script>
  /* 主题在首帧之前定下来，避免深色页面先闪一下白。
     默认跟随系统，用户手动切过就记在 localStorage。 */
  (function () {
    var t = null;
    try { t = localStorage.getItem('manual-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.dataset.theme = t;
  })();
</script>
